# Builds every plugin in plugins/ :
#   Windows : VST3 (x64)
#   macOS   : VST3 + AU, universal (arm64 + x86_64), validated with auval
# Push a tag "v1.2.3" to also publish the zipped plugins as a GitHub release.
name: Build plugins

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows VST3
            os: windows-latest
            preset: windows
            out: build/windows/out
          - name: macOS VST3 + AU
            os: macos-latest
            preset: macos
            out: build/macos/out/Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true          # iPlug2 + ysfx (not ysfx's JUCE/CLAP extras)

      - name: ysfx dependencies (dr_libs only)
        shell: bash
        run: git -C third_party/ysfx submodule update --init --depth 1 thirdparty/dr_libs

      - name: Cache VST3 SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: iPlug2/Dependencies/IPlug/VST3_SDK
          key: vst3-sdk-${{ runner.os }}-${{ hashFiles('iPlug2/Dependencies/IPlug/download-vst3-sdk.sh') }}

      - name: Download VST3 SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd iPlug2/Dependencies/IPlug
          ./download-vst3-sdk.sh

      - name: Configure
        # deployment copies the plugins to the user plugin folders: auval needs it
        run: cmake --preset ${{ matrix.preset }} -DIPLUG_DEPLOY_PLUGINS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Engine tests
        run: ctest --preset ${{ matrix.preset }}

      - name: Sign plugins (ad-hoc) and install the AUs
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          # Apple Silicon refuses to load code whose signature is missing or
          # invalid. The copies made during the build can predate Xcode's final
          # signing step, so sign the finished bundles explicitly (ad-hoc, no
          # certificate needed) and install those for auval. The same signed
          # bundles are uploaded as artifacts.
          for b in ${{ matrix.out }}/*.component ${{ matrix.out }}/*.vst3; do
            codesign --force --deep --sign - "$b"
            codesign --verify --deep --strict "$b"
            echo "signed: $b"
          done
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          for c in ${{ matrix.out }}/*.component; do
            rm -rf ~/Library/Audio/Plug-Ins/Components/"$(basename "$c")"
            cp -R "$c" ~/Library/Audio/Plug-Ins/Components/
          done
          killall -9 AudioComponentRegistrar 2>/dev/null || true   # refresh the AU cache

      - name: Validate Audio Units (auval)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Prints why macOS cannot open a component (auval only says "-1").
          diagnose() { # <bundle> <factory symbol>
            local bundle="$1" name="$(basename "$1" .component)" bin="$1/Contents/MacOS/$(basename "$1" .component)"
            echo "::group::Diagnostics for $bundle"
            echo "--- architectures";      lipo -archs "$bin" || true
            echo "--- signature";          codesign -dv "$bundle" 2>&1 || true
            codesign --verify --deep --strict -v "$bundle" 2>&1 || true
            echo "--- linked libraries";   otool -L "$bin" || true
            echo "--- exported factory";   nm -gU "$bin" | grep -i "$2" || echo "factory symbol $2 NOT exported"
            echo "--- dlopen in a native process (shows the dyld error, if any)"
            python3 -c "import ctypes,sys; lib=ctypes.CDLL(sys.argv[1]); getattr(lib, sys.argv[2]); print('dlopen OK, factory found')" "$bin" "_$2" 2>&1 \
              || python3 -c "import ctypes,sys; lib=ctypes.CDLL(sys.argv[1]); getattr(lib, sys.argv[2]); print('dlopen OK, factory found')" "$bin" "$2" 2>&1 || true
            echo "--- system log (last 3 min)"
            log show --last 3m --style compact \
              --predicate 'process == "auvaltool" OR process == "AudioComponentRegistrar" OR senderImagePath CONTAINS "AudioToolbox" OR eventMessage CONTAINS "'"$name"'" OR eventMessage CONTAINS[c] "code signature"' \
              2>/dev/null | tail -60 || true
            echo "::endgroup::"
          }
          status=0
          for manifest in plugins/*/plugin.json; do
            name=$(jq -r '.name' "$manifest")
            type=$(jq -r '.type // "effect"' "$manifest")
            midi_in=$(jq -r '.midi_in // empty' "$manifest")
            case "$type" in
              instrument)  au=aumu ;;
              midi-effect) au=aumi ;;
              *)           if [ "$midi_in" = "true" ]; then au=aumf; else au=aufx; fi ;;
            esac
            sub=$(jq -r '.plugin_code' "$manifest")
            mfr=$(jq -r '.manufacturer_code' "$manifest")
            echo "::group::auval -v $au $sub $mfr"
            if auval -strict -v "$au" "$sub" "$mfr"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::auval failed for $name"
              diagnose ~/Library/Audio/Plug-Ins/Components/"$name".component "${name}_Factory"
              status=1
            fi
          done
          exit $status

      - name: Collect plugins
        if: ${{ !cancelled() }}      # also when auval fails: the binaries are still useful to test
        shell: bash
        run: |
          mkdir -p dist
          cp -R ${{ matrix.out }}/*.vst3 dist/
          if [ "$RUNNER_OS" = "macOS" ]; then cp -R ${{ matrix.out }}/*.component dist/; fi
          ls -la dist

      - name: Upload artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ matrix.preset }}
          path: dist/

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -qry "../../${d%/}-${GITHUB_REF_NAME}.zip" .); done
          ls -la ..
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
